<!-- Bottom Nav is suppressed as this is a task-focused functional screen -->
<script>
        // Simple drag interaction for the bottom sheet (visual only for this prototype)
        const sheet = document.getElementById('metricsSheet');
        const handle = document.getElementById('dragHandleArea');
        let isExpanded = true;
        let startY = 0;

        handle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, {passive: true});

        handle.addEventListener('touchend', (e) => {
            const endY = e.changedTouches[0].clientY;
            const diff = endY - startY;
            
            if (diff > 50 && isExpanded) {
                // Collapse
                sheet.style.transform = 'translateY(65%)';
                isExpanded = false;
            } else if (diff < -50 && !isExpanded) {
                // Expand
                sheet.style.transform = 'translateY(0%)';
                isExpanded = true;
            }
        }, {passive: true});
        
        // Desktop click to toggle for preview purposes
        handle.addEventListener('click', () => {
             if (isExpanded) {
                sheet.style.transform = 'translateY(65%)';
                isExpanded = false;
            } else {
                sheet.style.transform = 'translateY(0%)';
                isExpanded = true;
            }
        });
    </script>
